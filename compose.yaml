name: ai-base

services:
  ai-console:
    build:
      context: .
      dockerfile: ai-console/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      AI_CONSOLE_DATA_DIR: /data
      DATABASE_URL: postgresql://ai_base:${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}@postgres:5432/ai_base
      AI_CONSOLE_SECRET_ENCRYPTION_KEY: ${AI_CONSOLE_SECRET_ENCRYPTION_KEY:-local-ai-console-secret-encryption-key-change-me}
      AI_CONSOLE_ADMIN_EMAILS: ${AI_CONSOLE_ADMIN_EMAILS:-admin@bluetron.cn}
      AI_CONSOLE_DEV_IDENTITY_ENABLED: ${AI_CONSOLE_DEV_IDENTITY_ENABLED:-false}
      AI_CONSOLE_PUBLIC_URL: ${AI_CONSOLE_PUBLIC_URL:-https://ai-console.localhost.pomerium.io:8443}
      WECOM_RELAY_SHARED_KEY: ${WECOM_RELAY_SHARED_KEY:-bG9jYWwtYWktYmFzZS13ZWNvbS1yZWxheS1rZXktdjE}
      POMERIUM_JWT_PUBLIC_KEY_PATH: /run/secrets/pomerium-signing-public.pem
      POMERIUM_JWT_AUDIENCE: ai-console.localhost.pomerium.io
      GLOBAL_GATEWAY_URL: http://global-gateway:8080
      MCP_ACCESS_GATEWAY_URL: http://mcp-access-gateway:8081
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-local-mcp-admin-token-change-me}
      MCP_PUBLIC_RESOURCE_URL: ${MCP_PUBLIC_RESOURCE_URL:-http://127.0.0.1:8080/mcp}
      AGENT_RUNTIME_URL: http://global-gateway:8080/runtime
      LLM_GATEWAY_URL: http://llm-gateway:1975
      LLM_GATEWAY_ADMIN_URL: http://global-gateway:8080/llm-admin
      OPEN_CONNECTOR_URL: http://global-gateway:8080/connector
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OPEN_CONNECTOR_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      MCP_CONNECTOR_BINDING_RESOLVER_TOKEN: ${MCP_CONNECTOR_BINDING_RESOLVER_TOKEN:-local-connector-binding-resolver-token-change-me}
      MCP_OIDC_ISSUER: ${MCP_OIDC_ISSUER:-http://127.0.0.1:8080/oauth}
      MCP_LOGIN_OIDC_ISSUER: ${MCP_LOGIN_OIDC_ISSUER:-http://dex.localtest.me:5556/dex}
      LIGHTRAG_URL: http://global-gateway:8080/rag
      LIGHTRAG_ADMIN_URL: http://lightrag:9622
      LIGHTRAG_ADMIN_TOKEN: ${LIGHTRAG_ADMIN_TOKEN:-local-lightrag-admin-token-change-me}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-local-lightrag-api-key-change-me}
      RAG_MCP_URL: http://rag-mcp:8080/mcp
      RAG_MCP_HEALTH_URL: http://rag-mcp:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JAEGER_URL: http://jaeger:16686
      JAEGER_PUBLIC_URL: https://jaeger.localhost.pomerium.io:8443
      PROMETHEUS_URL: http://prometheus:9090
      PROMPTFOO_URL: http://global-gateway:8080/promptfoo
      OIDC_ENABLED: "true"
    volumes:
      - console-data:/data
      - ./deploy/pomerium/dev-signing-public.pem:/run/secrets/pomerium-signing-public.pem:ro
    depends_on:
      global-gateway:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      open-connector:
        condition: service_started
      postgres:
        condition: service_healthy
      lightrag:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/services').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent-runtime:
    build:
      context: ./agent-runtime
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://ai_base:${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}@postgres:5432/ai_base
      LLM_GATEWAY_URL: http://llm-gateway:1975
      OPEN_CONNECTOR_URL: http://global-gateway:8080/connector
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: ai-base-agent-runtime
    depends_on:
      global-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: ai-base/postgres-age-pgvector:17
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ai_base
      POSTGRES_PASSWORD: ${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}
      POSTGRES_DB: ai_base
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_base -d ai_base"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pomerium-database-init:
    image: ai-base/postgres-age-pgvector:17
    restart: "no"
    environment:
      PGPASSWORD: ${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}
    command:
      - psql
      - --host=postgres
      - --username=ai_base
      - --dbname=ai_base
      - --set=ON_ERROR_STOP=1
      - --file=/bootstrap/004-pomerium-databases.sql
    volumes:
      - ./deploy/postgres/init/004-pomerium-databases.sql:/bootstrap/004-pomerium-databases.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  llm-gateway:
    build:
      context: .
      dockerfile: deploy/llm-gateway/Dockerfile
    restart: unless-stopped
    dns:
      - 172.30.54.53
    expose:
      - "1975"
      - "1064"
    environment:
      AIGW_RUN_ID: "0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-local-lightrag-api-key-change-me}
      LLM_GATEWAY_CONFIG_PATH: /control/llm-gateway-config.yaml
      LLM_GATEWAY_REVISION_PATH: /control/llm-gateway-revision
      OTEL_SERVICE_NAME: ai-base-llm-gateway
      OTEL_RESOURCE_ATTRIBUTES: traffic.origin=internal_service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_PROPAGATORS: tracecontext,baggage
      OPENINFERENCE_HIDE_INPUTS: "true"
      OPENINFERENCE_HIDE_OUTPUTS: "true"
      OPENINFERENCE_HIDE_EMBEDDINGS_TEXT: "true"
      OPENINFERENCE_HIDE_EMBEDDINGS_VECTORS: "true"
      OPENINFERENCE_HIDE_LLM_INVOCATION_PARAMETERS: "true"
      OTEL_AIGW_REQUEST_HEADER_ATTRIBUTES: ""
      OTEL_AIGW_SPAN_REQUEST_HEADER_ATTRIBUTES: "x-ai-base-traffic-origin:traffic.origin"
      OTEL_AIGW_METRICS_REQUEST_HEADER_ATTRIBUTES: "x-ai-base-traffic-origin:traffic.origin"
      OTEL_AIGW_LOG_REQUEST_HEADER_ATTRIBUTES: ""
    volumes:
      - console-data:/control:ro
    depends_on:
      egress-dns:
        condition: service_healthy
    networks:
      - default
      - egress-dns
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:1064/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcp-access-gateway:
    build:
      context: ./mcp-access-gateway
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      MCP_LISTEN_ADDRESS: ":8081"
      MCP_UPSTREAM_URL: http://llm-gateway:1975/mcp
      MCP_PUBLIC_RESOURCE_URL: ${MCP_PUBLIC_RESOURCE_URL:-http://127.0.0.1:8080/mcp}
      MCP_OIDC_ISSUER: ${MCP_OIDC_ISSUER:-http://127.0.0.1:8080/oauth}
      MCP_OIDC_JWKS_URL: http://127.0.0.1:8081/oauth/jwks
      MCP_OIDC_AUDIENCE: ${MCP_OIDC_AUDIENCE:-http://127.0.0.1:8080/mcp}
      MCP_OIDC_REQUIRED_SCOPES: ${MCP_OIDC_REQUIRED_SCOPES:-ai-base:mcp}
      MCP_LOGIN_OIDC_ISSUER: ${MCP_LOGIN_OIDC_ISSUER:-http://dex.localtest.me:5556/dex}
      MCP_LOGIN_OIDC_CLIENT_ID: ${MCP_LOGIN_OIDC_CLIENT_ID:-ai-base-mcp-broker}
      MCP_LOGIN_OIDC_REDIRECT_URL: ${MCP_LOGIN_OIDC_REDIRECT_URL:-http://127.0.0.1:8080/oauth/callback}
      MCP_OAUTH_SIGNING_KEY_PATH: /data/oauth-signing-key.pem
      MCP_OAUTH_REFRESH_STORE_PATH: /data/oauth-refresh-grants.json
      MCP_OAUTH_ACCESS_TOKEN_LIFETIME: ${MCP_OAUTH_ACCESS_TOKEN_LIFETIME:-1h}
      MCP_OAUTH_REFRESH_TOKEN_LIFETIME: ${MCP_OAUTH_REFRESH_TOKEN_LIFETIME:-2160h}
      MCP_OAUTH_ALLOWED_REDIRECT_URIS: ${MCP_OAUTH_ALLOWED_REDIRECT_URIS:-workbuddy://workbuddy/mcp/custom-mcp%3Aai-base/oauth/callback}
      MCP_SESSION_SIGNING_KEY: ${MCP_SESSION_SIGNING_KEY:-local-mcp-session-signing-key-change-me}
      MCP_SESSION_LIFETIME: ${MCP_SESSION_LIFETIME:-2160h}
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-local-mcp-admin-token-change-me}
      MCP_CONNECTOR_BINDING_RESOLVER_URL: http://ai-console:3000/api/internal/connector-bindings/resolve
      MCP_CONNECTOR_BINDING_RESOLVER_TOKEN: ${MCP_CONNECTOR_BINDING_RESOLVER_TOKEN:-local-connector-binding-resolver-token-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OBSERVABILITY_IDENTITY_HMAC_KEY: ${OBSERVABILITY_IDENTITY_HMAC_KEY:-local-observability-hmac-key-change-me}
      OBSERVABILITY_IDENTITY_HMAC_KEY_VERSION: ${OBSERVABILITY_IDENTITY_HMAC_KEY_VERSION:-local-v1}
    volumes:
      - mcp-auth-data:/data
    depends_on:
      llm-gateway:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  global-gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-local-lightrag-api-key-change-me}
    volumes:
      - ./deploy/global-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/global-gateway/wecom-verification:/srv/wecom-verification:ro
    depends_on:
      llm-gateway:
        condition: service_healthy
      mcp-access-gateway:
        condition: service_healthy
      open-connector:
        condition: service_started
      lightrag:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  egress-dns:
    image: adguard/dnsproxy:v0.83.0
    restart: unless-stopped
    command:
      - --listen=0.0.0.0
      - --port=53
      - --upstream=https://1.1.1.1/dns-query
      - --upstream=[/${AI_BASE_INTERNAL_DNS_ZONE:-bluetron.cn}/]127.0.0.11:53
      - --fallback=https://1.0.0.1/dns-query
      - --cache
      - --cache-size=4194304
      - --pending-requests-enabled
      - --refuse-any
      - --timeout=10s
    expose:
      - "53/udp"
      - "53/tcp"
    networks:
      egress-dns:
        ipv4_address: 172.30.54.53
    healthcheck:
      test: ["CMD", "nslookup", "linux.do", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  open-connector:
    image: ai-base/open-connector:main-27b111b
    build:
      context: ./vendor/open-connector
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    dns:
      - 172.30.54.53
    expose:
      - "3000"
    environment:
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-https://open-connector.localhost.pomerium.io:8443}
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OOMOL_CONNECT_BLOCKED_PROXIES: "*"
      OOMOL_CONNECT_ALLOW_PRIVATE_NETWORK: "false"
    volumes:
      - open-connector-data:/app/data
    depends_on:
      egress-dns:
        condition: service_healthy
    networks:
      - default
      - egress-dns

  open-connector-admin-proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
    volumes:
      - ./deploy/open-connector-admin-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      open-connector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  lightrag-input-init:
    image: ghcr.io/hkuds/lightrag:v1.4.16
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /inputs/.seeded ]; then
          mkdir -p /inputs/ai_base
          cp -R /seed/. /inputs/ai_base/
          touch /inputs/.seeded
        fi
    volumes:
      - lightrag-inputs:/inputs
      - ./deploy/lightrag/inputs:/seed:ro

  lightrag:
    image: ai-base/lightrag:v1.4.16
    build:
      context: .
      dockerfile: deploy/lightrag/Dockerfile
    restart: unless-stopped
    expose:
      - "9621"
      - "9622"
    environment:
      HOST: 0.0.0.0
      PORT: "9621"
      WEBUI_TITLE: AI Base 知识工作台
      WEBUI_DESCRIPTION: 企业知识图谱与检索增强生成
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      WORKSPACE: ai_base
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-local-lightrag-api-key-change-me}
      LIGHTRAG_ADMIN_TOKEN: ${LIGHTRAG_ADMIN_TOKEN:-local-lightrag-admin-token-change-me}
      LIGHTRAG_CONFIG_FILE: /app/data/config/lightrag-config.json
      WHITELIST_PATHS: /health
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: PGGraphStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ai_base
      POSTGRES_PASSWORD: ${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}
      POSTGRES_DATABASE: ai_base
      POSTGRES_MAX_CONNECTIONS: "12"
      POSTGRES_VECTOR_INDEX_TYPE: HNSW
      LLM_BINDING: openai
      LLM_BINDING_HOST: http://llm-gateway:1975/v1
      LLM_BINDING_API_KEY: ai-base-internal
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-qwen}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: http://llm-gateway:1975/v1
      EMBEDDING_BINDING_API_KEY: ai-base-internal
      EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1024}
      EMBEDDING_TOKEN_LIMIT: ${LIGHTRAG_EMBEDDING_TOKEN_LIMIT:-8192}
      SUMMARY_LANGUAGE: Chinese
      MAX_ASYNC: "4"
      MAX_PARALLEL_INSERT: "2"
    volumes:
      - lightrag-data:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs
      - lightrag-config:/app/data/config
    depends_on:
      lightrag-input-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9622/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  rag-mcp:
    image: ai-base/rag-mcp
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      RAG_MCP_LISTEN_ADDRESS: 0.0.0.0
      RAG_MCP_PORT: "8080"
      LIGHTRAG_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-local-lightrag-api-key-change-me}
    depends_on:
      lightrag:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  jaeger-storage-init:
    image: jaegertracing/jaeger:2.19.0
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/busybox", "sh", "-c"]
    command: ["mkdir -p /badger/keys /badger/values && chown 10001:0 /badger /badger/keys /badger/values"]
    volumes:
      - jaeger-data:/badger

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    command: ["--config=file:/etc/jaeger/jaeger.yaml"]
    expose:
      - "16686"
      - "16685"
      - "4317"
      - "4318"
      - "13133"
      - "8888"
      - "8889"
    volumes:
      - ./deploy/jaeger/jaeger.yaml:/etc/jaeger/jaeger.yaml:ro
      - jaeger-data:/badger
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    expose:
      - "4317"
      - "4318"
      - "13133"
    volumes:
      - ./deploy/otel-collector/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
    expose:
      - "9090"
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/observability-rules.yaml:/etc/prometheus/observability-rules.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:0.121.19
    profiles: ["quality"]
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - promptfoo-data:/home/promptfoo/.promptfoo
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  pomerium:
    image: pomerium/pomerium:v0.32.7
    restart: unless-stopped
    expose:
      - "443"
    environment:
      IDP_PROVIDER: oidc
      IDP_PROVIDER_URL: ${POMERIUM_IDP_PROVIDER_URL:-http://dex.localtest.me:5556/dex}
      IDP_CLIENT_ID: ${POMERIUM_IDP_CLIENT_ID:-ai-base-pomerium}
      IDP_CLIENT_SECRET: ${POMERIUM_IDP_CLIENT_SECRET:-replace-with-the-external-oidc-client-secret}
      COOKIE_SECRET: ${POMERIUM_COOKIE_SECRET:-f3w8vZzhlwLw1DIXoCaILrswiMeDabDaRcyH6JBMwoc=}
      SHARED_SECRET: ${POMERIUM_SHARED_SECRET:-tq+Rx6zdR8G7iv9SFdiCS1dBGVnug94N+WyOSx1QyCM=}
      DATABROKER_STORAGE_TYPE: postgres
      DATABROKER_STORAGE_CONNECTION_STRING: postgresql://ai_base:${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}@postgres:5432/ai_base_pomerium?sslmode=disable
    volumes:
      - ./deploy/pomerium/config.example.yaml:/pomerium/config.yaml:ro
      - ./deploy/pomerium/dev-signing-key.pem:/run/secrets/pomerium-signing-key.pem:ro
    depends_on:
      pomerium-database-init:
        condition: service_completed_successfully
      ai-console:
        condition: service_healthy
      open-connector-admin-proxy:
        condition: service_healthy
      jaeger:
        condition: service_healthy

volumes:
  console-data:
  mcp-auth-data:
  open-connector-data:
  lightrag-data:
  lightrag-config:
  lightrag-inputs:
  postgres-data:
  promptfoo-data:
  jaeger-data:
  prometheus-data:

networks:
  default:
    name: ai-base
  egress-dns:
    name: ai-base-egress-dns
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.54.0/24
