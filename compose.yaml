name: ai-base

services:
  ai-console:
    build:
      context: .
      dockerfile: ai-console/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      AI_CONSOLE_DATA_DIR: /data
      GLOBAL_GATEWAY_URL: http://global-gateway:8080
      AGENT_RUNTIME_URL: http://global-gateway:8080/runtime
      LLM_GATEWAY_URL: http://global-gateway:8080
      LLM_GATEWAY_ADMIN_URL: http://global-gateway:8080/llm-admin
      OPEN_CONNECTOR_URL: http://global-gateway:8080/connector
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OPEN_CONNECTOR_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      SILVERBULLET_URL: http://global-gateway:8080/knowledge
      SILVERBULLET_SPACE_DIR: /knowledge
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JAEGER_URL: http://global-gateway:8080/jaeger
      PROMPTFOO_URL: http://global-gateway:8080/promptfoo
      OIDC_ENABLED: "true"
    volumes:
      - console-data:/data
      - ./deploy/silverbullet/space:/knowledge:ro
    depends_on:
      global-gateway:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      open-connector:
        condition: service_started
      silverbullet:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/services').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent-runtime:
    build:
      context: ./agent-runtime
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://ai_base:${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}@postgres:5432/ai_base
      LLM_GATEWAY_URL: http://global-gateway:8080
      OPEN_CONNECTOR_URL: http://global-gateway:8080/connector
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://global-gateway:8080/otel/v1/traces
      OTEL_SERVICE_NAME: ai-base-agent-runtime
    depends_on:
      global-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ai_base
      POSTGRES_PASSWORD: ${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}
      POSTGRES_DB: ai_base
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_base -d ai_base"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  llm-gateway:
    build:
      context: .
      dockerfile: deploy/llm-gateway/Dockerfile
    restart: unless-stopped
    expose:
      - "1975"
      - "1064"
    environment:
      AIGW_RUN_ID: "0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      LLM_GATEWAY_CONFIG_PATH: /control/llm-gateway-config.yaml
      LLM_GATEWAY_REVISION_PATH: /control/llm-gateway-revision
    volumes:
      - console-data:/control:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:1064/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  global-gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/global-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      llm-gateway:
        condition: service_healthy
      open-connector:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  open-connector:
    image: ghcr.io/oomol-lab/open-connector:v1.2.0
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-https://open-connector.localhost.pomerium.io:8443}
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OOMOL_CONNECT_BLOCKED_PROXIES: "*"
      OOMOL_CONNECT_ALLOW_PRIVATE_NETWORK: "false"
    volumes:
      - open-connector-data:/app/data

  open-connector-admin-proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
    volumes:
      - ./deploy/open-connector-admin-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      open-connector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SB_SHELL_BACKEND: "off"
      SB_USER: ${SILVERBULLET_USER:-}
    volumes:
      - ./deploy/silverbullet/space:/space

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    expose:
      - "16686"
      - "4317"
      - "4318"
      - "13133"

  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:0.121.19
    profiles: ["quality"]
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - promptfoo-data:/home/promptfoo/.promptfoo
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  pomerium:
    image: pomerium/pomerium:v0.32.7
    restart: unless-stopped
    expose:
      - "443"
    environment:
      IDP_PROVIDER: oidc
      IDP_PROVIDER_URL: ${POMERIUM_IDP_PROVIDER_URL:-https://ids.bluetron.cn/realms/master}
      IDP_CLIENT_ID: ${POMERIUM_IDP_CLIENT_ID:-ai-base-pomerium}
      IDP_CLIENT_SECRET: ${POMERIUM_IDP_CLIENT_SECRET:-replace-with-the-external-oidc-client-secret}
      COOKIE_SECRET: ${POMERIUM_COOKIE_SECRET:-f3w8vZzhlwLw1DIXoCaILrswiMeDabDaRcyH6JBMwoc=}
      SHARED_SECRET: ${POMERIUM_SHARED_SECRET:-tq+Rx6zdR8G7iv9SFdiCS1dBGVnug94N+WyOSx1QyCM=}
    volumes:
      - ./deploy/pomerium/config.example.yaml:/pomerium/config.yaml:ro
    depends_on:
      ai-console:
        condition: service_healthy
      open-connector-admin-proxy:
        condition: service_healthy

volumes:
  console-data:
  open-connector-data:
  postgres-data:
  promptfoo-data:

networks:
  default:
    name: ai-base
