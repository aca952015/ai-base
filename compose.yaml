name: ai-base

services:
  ai-console:
    build:
      context: .
      dockerfile: ai-console/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AI_CONSOLE_DATA_DIR: /data
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      BIFROST_URL: http://bifrost:8080
      OPEN_CONNECTOR_URL: http://open-connector:3000
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OPEN_CONNECTOR_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      SILVERBULLET_URL: http://silverbullet:3000
      SILVERBULLET_SPACE_DIR: /knowledge
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JAEGER_URL: http://jaeger:16686
      PROMPTFOO_URL: http://promptfoo:3000
    volumes:
      - console-data:/data
      - ./deploy/silverbullet/space:/knowledge:ro
    depends_on:
      agent-runtime:
        condition: service_healthy
      bifrost:
        condition: service_started
      open-connector:
        condition: service_started
      silverbullet:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/services').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent-runtime:
    build:
      context: ./agent-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      DATABASE_URL: postgresql://ai_base:${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}@postgres:5432/ai_base
      BIFROST_URL: http://bifrost:8080
      OPEN_CONNECTOR_URL: http://open-connector:3000
      OPEN_CONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: ai-base-agent-runtime
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ai_base
      POSTGRES_PASSWORD: ${AI_BASE_POSTGRES_PASSWORD:-ai-base-local-only}
      POSTGRES_DB: ai_base
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_base -d ai_base"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bifrost:
    image: maximhq/bifrost:v1.6.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
    volumes:
      - bifrost-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  open-connector:
    image: ghcr.io/oomol-lab/open-connector:v1.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      OOMOL_CONNECT_ORIGIN: http://localhost:3100
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-local-admin-token-change-me}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-local-runtime-token-change-me}
      OOMOL_CONNECT_BLOCKED_PROXIES: "*"
      OOMOL_CONNECT_ALLOW_PRIVATE_NETWORK: "false"
    volumes:
      - open-connector-data:/app/data

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      SB_SHELL_BACKEND: "off"
      SB_USER: ${SILVERBULLET_USER:-}
    volumes:
      - ./deploy/silverbullet/space:/space

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"

  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:0.121.19
    profiles: ["quality"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - promptfoo-data:/home/promptfoo/.promptfoo
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  pomerium:
    image: pomerium/pomerium:v0.32.7
    profiles: ["oidc"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/pomerium/config.example.yaml:/pomerium/config.yaml:ro
    depends_on:
      ai-console:
        condition: service_healthy

volumes:
  bifrost-data:
  console-data:
  open-connector-data:
  postgres-data:
  promptfoo-data:

networks:
  default:
    name: ai-base
