global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 15d

otlp:
  promote_resource_attributes:
    - service.name

rule_files:
  - /etc/prometheus/observability-rules.yaml

scrape_configs:
  - job_name: jaeger-spanmetrics
    static_configs:
      - targets: [jaeger:8889]

  - job_name: jaeger-internal
    static_configs:
      - targets: [jaeger:8888]
