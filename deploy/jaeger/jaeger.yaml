service:
  extensions: [healthcheckv2, jaeger_storage, jaeger_query]
  pipelines:
    traces/storage:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-span-events, attributes/redact, batch]
      exporters: [jaeger_storage_exporter]
    traces/mcp-metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-span-events, attributes/redact, filter/mcp-metrics, batch]
      exporters: [span_metrics]
    metrics/spanmetrics:
      receivers: [span_metrics]
      exporters: [prometheus]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badger_storage
      metrics: prometheus_metrics
    grpc:
      endpoint: 0.0.0.0:16685
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      badger_storage:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 336h
          metrics_update_interval: 10s
    metric_backends:
      prometheus_metrics:
        prometheus:
          endpoint: http://prometheus:9090
          normalize_calls: true
          normalize_duration: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  attributes/redact:
    actions:
      - key: otel.status_description
        action: delete
      - key: error.message
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
      - key: input.value
        action: delete
      - key: output.value
        action: delete
      - key: llm.invocation_parameters
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.definitions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.retrieval.query.text
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - pattern: (?i)^(input|output|llm\.input_messages|llm\.output_messages|embedding)(\.|$)
        action: delete
      - pattern: (?i)(authorization|cookie|token|secret|api[-_.]?key|password)
        action: delete

  # Trace detail is intentionally event-free. SDKs frequently put exception
  # messages and stack traces on span events, outside the attributes processor.
  filter/drop-span-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'true'

  filter/mcp-metrics:
    error_mode: ignore
    traces:
      span:
        - 'name != "mcp.server.message" and (attributes["mcp.method.name"] == nil or attributes["traffic.origin"] != "internal_envoy")'

  batch:
    timeout: 2s
    send_batch_size: 512

connectors:
  span_metrics:
    namespace: mcp
    metrics_flush_interval: 15s
    resource_metrics_key_attributes: [service.name]
    dimensions:
      - name: traffic.origin
      - name: mcp.method.name
      - name: mcp.server.name
      - name: mcp.tool.name
      - name: mcp.action.name
      - name: mcp.decision
      - name: mcp.reason
      - name: mcp.result
      - name: error.type

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_storage
  prometheus:
    endpoint: 0.0.0.0:8889
