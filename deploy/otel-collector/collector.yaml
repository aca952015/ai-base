extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48

  filter/drop-span-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'true'

  transform/redact-status:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(span.status.message, "")

  attributes/redact:
    actions:
      - key: otel.status_description
        action: delete
      - key: error.message
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
      - key: input.value
        action: delete
      - key: output.value
        action: delete
      - key: llm.invocation_parameters
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.definitions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.retrieval.query.text
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - pattern: (?i)^(input|output|llm\.input_messages|llm\.output_messages|embedding)(\.|$)
        action: delete
      - pattern: (?i)(authorization|cookie|token|secret|api[-_.]?key|password)
        action: delete

  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-span-events, transform/redact-status, attributes/redact, batch]
      exporters: [otlphttp/jaeger]
  telemetry:
    logs:
      level: info
