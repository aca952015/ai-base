# The OIDC provider and client credentials are external to AI Base and are
# supplied by compose environment variables.
authenticate_service_url: https://authenticate.localhost.pomerium.io:8443
idp_scopes: openid,profile,email,offline_access
cookie_expire: 2160h
signing_key_file: /run/secrets/pomerium-signing-key.pem
signout_redirect_url: https://ai-console.localhost.pomerium.io:8443

routes:
  - from: https://ai-console.localhost.pomerium.io:8443
    to: http://ai-console:3000
    pass_identity_headers: true
    policy:
      - allow:
          and:
            - domain:
                is: example.com

  - from: https://open-connector.localhost.pomerium.io:8443
    to: http://open-connector-admin-proxy:3000
    pass_identity_headers: true
    policy:
      - allow:
          and:
            - domain:
                is: example.com

  - from: https://jaeger.localhost.pomerium.io:8443
    to: http://jaeger:16686
    pass_identity_headers: false
    policy:
      - allow:
          and:
            - domain:
                is: example.com
            - email:
                is: admin@example.com
