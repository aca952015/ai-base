# Dedicated Pomerium entry for enterprise WeCom workbench users. The static
# Dex request parameter selects the WeCom connector without showing a provider
# chooser, while the regular Pomerium instance keeps its normal login options.
authenticate_service_url: https://authenticate-wework.localhost.pomerium.io:8443
idp_scopes: openid,profile,email
idp_request_params:
  connector_id: wecom
cookie_expire: 14h
signing_key_file: /run/secrets/pomerium-signing-key.pem
signout_redirect_url: https://ai-console.localhost.pomerium.io:8443

routes:
  - from: https://wework.localhost.pomerium.io:8443
    to: http://ai-console:3000
    pass_identity_headers: true
    policy:
      - allow:
          and:
            - domain:
                is: bluetron.cn
